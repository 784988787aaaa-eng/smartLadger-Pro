name: SmartLedger Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Keep one authoritative Windows build and cancel stale runs for the same PR/ref.
concurrency:
  group: smartledger-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and publish Windows x64
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show .NET SDK
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore ./SmartLedger.sln

      - name: Build Release
        run: dotnet build ./SmartLedger.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ./SmartLedger.sln --configuration Release --no-build --verbosity normal

      - name: Restore Windows x64 publish target
        run: dotnet restore ./src/SmartLedger.App/SmartLedger.App.csproj --runtime win-x64

      - name: Publish Windows x64 application
        run: dotnet publish ./src/SmartLedger.App/SmartLedger.App.csproj --configuration Release -p:PublishProfile=WinX64 --runtime win-x64 --no-restore

      - name: Upload Windows x64 package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartLedger-Windows-x64-${{ github.run_number }}
          path: src/SmartLedger.App/bin/Release/net10.0-windows/win-x64/publish/
          if-no-files-found: error
          retention-days: 14
