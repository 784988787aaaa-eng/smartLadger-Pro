name: SmartLedger Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show .NET SDK
        run: dotnet --info

      - name: Restore solution
        run: dotnet restore ./SmartLedger.sln

      - name: Build Release
        run: dotnet build ./SmartLedger.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ./SmartLedger.sln --configuration Release --no-build --verbosity minimal

      - name: Upload Release outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartLedger-Release-${{ github.run_number }}
          path: src/SmartLedger.App/bin/Release/net10.0-windows/
          if-no-files-found: warn
          retention-days: 14
