# Keep the legacy workflow compatible with this Windows-only WPF solution.
name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ./SmartLedger.sln
      - name: Build
        run: dotnet build ./SmartLedger.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test ./SmartLedger.sln --configuration Release --no-build --verbosity normal
