name: Inventory Dialog Validation

on:
  push:
    branches: [ "feature/inventory-entry-polish" ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore ./SmartLedger.sln
      - name: Build Release
        run: dotnet build ./SmartLedger.sln --configuration Release --no-restore
      - name: Run tests
        run: dotnet test ./SmartLedger.sln --configuration Release --no-build --verbosity normal
